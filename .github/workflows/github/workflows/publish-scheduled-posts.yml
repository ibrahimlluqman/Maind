name: Publish scheduled Instagram posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run scheduler
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        working-directory: scripts
        run: python publish_scheduled.py

      - name: Commit updated post statuses
        run: |
          git config user.name "scheduler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scheduled_posts.json
          git diff --staged --quiet || git commit -m "chore: update scheduled post status [skip ci]"
          git push
