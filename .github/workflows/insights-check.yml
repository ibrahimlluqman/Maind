name: Instagram account insights check

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch account insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        working-directory: scripts
        run: python fetch_insights.py

      - name: Commit insights log
        run: |
          git config user.name "scheduler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/insights_log.json
          git diff --staged --quiet || git commit -m "chore: log account insights [skip ci]"
          git push
